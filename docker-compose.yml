services:
  ai:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    networks:
      - hub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  hub-network:
    external: true
    name: hub-network
