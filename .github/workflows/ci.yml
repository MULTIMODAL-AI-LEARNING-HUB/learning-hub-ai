name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Lint Tools
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dev dependencies
        # requirements-dev.txt is intentionally lightweight (no torch / sentence-transformers)
        # so this step completes in seconds instead of minutes.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME_AI }}/web

      - name: Push Docker image to Heroku
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME_AI }}/web

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release Heroku Container
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku stack:set container --app ${{ secrets.HEROKU_APP_NAME_AI }}
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME_AI }} || {
            echo "========================================="
            echo "Release failed! Fetching Heroku release logs..."
            echo "========================================="
            heroku releases --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 5
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 100
            exit 1
          }

      - name: Health Check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Waiting for dyno to start..."
          sleep 30
          echo "Checking dyno status..."
          heroku ps --app ${{ secrets.HEROKU_APP_NAME_AI }}
          HEROKU_APP_URL=$(heroku apps:info --app ${{ secrets.HEROKU_APP_NAME_AI }} --shell | grep -i "web_url" | cut -d'=' -f2)
          if [ -z "$HEROKU_APP_URL" ]; then
            HEROKU_APP_URL="https://${{ secrets.HEROKU_APP_NAME_AI }}.herokuapp.com/"
          fi
          echo "Checking health endpoint at: ${HEROKU_APP_URL}health"

          for i in 1 2 3; do
            echo "Attempt $i/3..."
            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" "${HEROKU_APP_URL}health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed! (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i failed with HTTP $HTTP_CODE. Waiting 15s before retry..."
            sleep 15
          done

          echo "Health check failed after 3 attempts!"
          heroku logs --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 100
          exit 1
