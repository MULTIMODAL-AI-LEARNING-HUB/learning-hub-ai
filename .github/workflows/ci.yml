name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Lint Tools
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dev dependencies
        # requirements-dev.txt is intentionally lightweight (no torch / sentence-transformers)
        # so this step completes in seconds instead of minutes.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME_AI }}/web
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release Heroku Container
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku stack:set container --app ${{ secrets.HEROKU_APP_NAME_AI }}
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME_AI }} || {
            echo "========================================="
            echo "Release failed! Fetching Heroku release logs..."
            echo "========================================="
            heroku releases --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 5
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 100
            exit 1
          }

      - name: Health Check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Waiting for dyno to start..."
          sleep 20
          echo "Checking dyno status..."
          heroku ps --app ${{ secrets.HEROKU_APP_NAME_AI }}
          HEROKU_APP_URL="https://${{ secrets.HEROKU_APP_NAME_AI }}.herokuapp.com/"
          echo "Checking health endpoint at: ${HEROKU_APP_URL}health"
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "${HEROKU_APP_URL}health")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed! (HTTP $HTTP_CODE)"
          else
            echo "Health check failed! (HTTP $HTTP_CODE)"
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_AI }} -n 50
            exit 1
          fi
